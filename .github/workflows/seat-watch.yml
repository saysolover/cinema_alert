name: 취소표 감시

# watch/seats.json에 등록된 회차의 잔여석이 기준 미만 → 이상으로 늘면 디스코드로 알린다(B7). 설명: watch/README.md
# 호출: cron-job.org가 5분마다 workflow_dispatch. 상영 24시간 안인 회차가 있으면 한 번의 실행 안에서 1분(CGV만이면 2분) 간격으로 반복 확인하고 끝낸다.
# 새 실행이 오면 이전 실행은 취소된다(concurrency). 상태는 매 확인마다 파일에 쓰고, 취소돼도 캐시에 저장한다.
# 아래 schedule은 cron-job.org가 멈췄을 때의 보험이다. 목록이 비어 있으면 요청 없이 바로 끝난다.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '시험 모드(디스코드 전송·파일 쓰기 없음)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seat-watch
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Check whether anything is registered
        id: pre
        run: |
          if [ -f watch/seats.json ] && [ "$(jq 'length' watch/seats.json)" -gt 0 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "감시 목록이 비어 있어 종료"
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      # 마지막 잔여석·알림 시각·연속 실패 횟수는 저장소 커밋 대신 actions/cache에 둔다(커밋 폭주 방지).
      - name: Restore seat state
        if: steps.pre.outputs.active == 'true'
        uses: actions/cache/restore@v5
        with:
          path: seat_state.json
          key: seat-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            seat-state-

      - name: Watch seats
        id: watch
        if: steps.pre.outputs.active == 'true'
        timeout-minutes: 6
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CGV_RELAY_URL: ${{ secrets.CGV_RELAY_URL }}
          CGV_RELAY_TOKEN: ${{ secrets.CGV_RELAY_TOKEN }}
          DTRYX_RELAY_URL: ${{ secrets.DTRYX_RELAY_URL }}
          DTRYX_RELAY_TOKEN: ${{ secrets.DTRYX_RELAY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "STATE_BEFORE=$(sha256sum seat_state.json 2>/dev/null | cut -d' ' -f1)" >> "$GITHUB_ENV"
          node scripts/seat_watch.js

      # 취소(새 실행이 옴)나 실패로 위 단계가 끝까지 못 가도 바뀐 상태는 저장한다.
      - name: Detect state change
        id: after
        if: always() && steps.pre.outputs.active == 'true'
        run: |
          after=$(sha256sum seat_state.json 2>/dev/null | cut -d' ' -f1)
          if [ "$STATE_BEFORE" != "$after" ]; then echo "state_changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save seat state
        if: always() && steps.after.outputs.state_changed == 'true'
        uses: actions/cache/save@v5
        with:
          path: seat_state.json
          key: seat-state-${{ github.run_id }}-${{ github.run_attempt }}

      # 회차가 확정되거나(show_id) 만료 항목이 지워져 목록이 바뀐 때만 커밋한다. 봇이 같은 파일을 갱신하므로 rebase 후 push.
      - name: Commit updated list
        if: steps.pre.outputs.active == 'true' && inputs.dry_run != true
        run: |
          if [ -n "$(git status --porcelain watch/seats.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add watch/seats.json
            git commit -m "chore: update seat watch list"
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
              sleep 3
            done
            exit 1
          else
            echo "목록 변경 없음"
          fi

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -H 'Content-Type: application/json' \
            -d "{\"content\":\"⚠️ 취소표 감시 실패 — 알림이 누락될 수 있음\n$RUN_URL\"}" \
            "$DISCORD_WEBHOOK" || true
