name: 알림 메시지 형식 확인

on:
  pull_request:
    paths:
      - '.github/workflows/dtryx-booking-watch.yml'
      - '.github/workflows/cineq-booking-watch.yml'
      - 'scripts/check_message_format.js'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check_message_format.js
