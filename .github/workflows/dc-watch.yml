name: DC 오티켓 개봉예정작 리스트 감시

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check gallery and notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat > check.js << 'SCRIPT_EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const SEARCH_URL = 'https://gall.dcinside.com/mgallery/board/lists?id=oticket&s_type=search_subject_memo&s_keyword=%EA%B0%9C%EB%B4%89%20%EC%98%88%EC%A0%95%20%EC%98%81%ED%99%94%20%EB%A6%AC%EC%8A%A4%ED%8A%B8';
          const STATE_FILE = 'last_seen.txt';
          // 실제 게시글 행은 위쪽 일반목록/아래쪽 검색위젯 어디에 뜨든 항상 class="us-post" data-no="글번호".
          const ROW_SELECTOR = 'tr.us-post[data-no]';
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function loadResults(page) {
            await page.goto(SEARCH_URL, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForSelector(ROW_SELECTOR, { timeout: 15000 });
          }

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            });

            // DNS/네트워크 일시 장애 대비 3회 시도, 시도 사이 10초 대기
            // (곧바로 재시도하면 같은 순간의 blip을 또 맞음 → 간격을 둠).
            let lastErr;
            let loaded = false;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                await loadResults(page);
                loaded = true;
                break;
              } catch (e) {
                lastErr = e;
                console.log(`${attempt}차 시도 실패:`, e.message);
                if (attempt < 3) await sleep(10000);
              }
            }
            if (!loaded) {
              await page.screenshot({ path: 'failure.png', fullPage: true }).catch(() => {});
              fs.writeFileSync('failure.html', await page.content().catch(() => ''));
              await browser.close();
              throw lastErr;
            }

            const rows = await page.$$eval(ROW_SELECTOR, trs => trs.map(tr => {
              const titA = tr.querySelector('td.gall_tit a');
              const dateEl = tr.querySelector('td.gall_date');
              if (!titA || !dateEl) return null;
              const title = titA.textContent.trim();
              const isoDate = dateEl.getAttribute('title');
              const no = tr.getAttribute('data-no');
              if (!title || !isoDate || !no) return null;
              return { title, isoDate, no };
            }).filter(Boolean));

            await browser.close();

            const byNo = new Map();
            for (const r of rows) byNo.set(r.no, r);
            // 단어 포함 여부만 보면 잡담 글("개봉 예정 영화 리스트 올려주는 오붕이에게 …")도 걸린다.
            // 실제 리스트 글은 제목이 "개봉 예정 영화 리스트 (9월 4주차~)"처럼 문구 뒤에 괄호로 월/주차가 붙는다.
            const LIST_TITLE_RE = /^\s*\[?\s*개봉\s*예정\s*영화\s*리스트\s*\]?\s*[(\[]\s*\d+\s*월/;
            const candidates = [...byNo.values()].filter(r => LIST_TITLE_RE.test(r.title));

            if (!fs.existsSync(STATE_FILE)) {
              const initNo = candidates.length ? Math.max(...candidates.map(r => parseInt(r.no, 10))) : 0;
              fs.writeFileSync(STATE_FILE, String(initNo));
              console.log('최초 실행: 상태 파일 초기화(', initNo, '), 알림 생략.');
              return;
            }

            const lastSeen = parseInt(fs.readFileSync(STATE_FILE, 'utf8').trim(), 10) || 0;
            const fresh = candidates
              .filter(r => parseInt(r.no, 10) > lastSeen)
              .sort((a, b) => parseInt(a.no, 10) - parseInt(b.no, 10));

            if (fresh.length === 0) {
              console.log('새 글 없음. 종료.');
              return;
            }

            for (const post of fresh) {
              const link = `https://gall.dcinside.com/mgallery/board/view/?id=oticket&no=${post.no}`;
              const content = `🎬 새 개봉 예정작 리스트 글이 올라왔습니다!\n제목: ${post.title}\n작성시각: ${post.isoDate}\n링크: ${link}`;
              const res = await fetch(process.env.DISCORD_WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
              });
              console.log('Discord 응답 상태:', res.status);
            }

            fs.writeFileSync(STATE_FILE, String(Math.max(...fresh.map(r => parseInt(r.no, 10)))));
          })();
          SCRIPT_EOF
          node check.js

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence
          path: |
            failure.png
            failure.html
          retention-days: 7

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain last_seen.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last_seen.txt
            git commit -m "chore: update last seen post number"
            git push
          else
            echo "상태 변경 없음"
          fi
