name: timeout probe (temporary, removed before merge)

on:
  push:
    branches: [fix/ci-timeouts-resolve-throttle]
    paths: ['.github/workflows/timeout-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Hung step (stands in for a stuck apt install)
        timeout-minutes: 1
        run: sleep 150

      - name: Failure-only step (stands in for the Discord alert)
        if: failure()
        run: echo "failure() step ran after the step timeout"