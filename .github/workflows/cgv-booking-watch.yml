name: CGV 예매 오픈 감시

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cgv-booking-watch
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check CGV booking status and notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat > check_cgv.js << 'SCRIPT_EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const KEYWORDS_FILE = 'keywords.txt';
          const THEATERS_FILE = 'theaters.txt';
          const STATE_FILE = 'cgv_state.json';

          function loadLines(file) {
            if (!fs.existsSync(file)) return [];
            return fs.readFileSync(file, 'utf8').split('\n').map(s => s.trim()).filter(Boolean);
          }

          function loadCgvSites() {
            const sites = {};
            for (const line of loadLines(THEATERS_FILE)) {
              const [chain, name, code] = line.split(',').map(s => s.trim());
              if (chain === 'CGV' && name && code) sites[name] = code;
            }
            return sites;
          }

          (async () => {
            const keywords = loadLines(KEYWORDS_FILE);
            const SITES = loadCgvSites();
            if (keywords.length === 0 || Object.keys(SITES).length === 0) {
              console.log('keywords.txt 또는 theaters.txt(CGV)에 감시 대상이 없음. 종료.');
              return;
            }

            const state = fs.existsSync(STATE_FILE) ? JSON.parse(fs.readFileSync(STATE_FILE, 'utf8')) : {};
            const siteNames = Object.keys(SITES);
            const isDone = k => siteNames.every(s => state[`${k}|${s}`] === true);
            if (keywords.every(isDone)) {
              console.log('모든 키워드/극장 알림 완료 — 조회 생략.');
              return;
            }

            const browser = await chromium.launch();
            const page = await browser.newPage({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            });

            try {
              await page.goto('https://cgv.co.kr', { waitUntil: 'domcontentloaded', timeout: 30000 });
            } catch (e) {
              await page.screenshot({ path: 'cgv_failure.png', fullPage: true }).catch(() => {});
              fs.writeFileSync('cgv_failure.html', await page.content().catch(() => ''));
              await browser.close();
              throw e;
            }

            // CGV API가 가끔 JSON 대신 HTML 에러 페이지를 응답함(직접 확인됨) — 재시도 후 그래도 안 되면 빈 배열로 처리.
            const chart = await page.evaluate(async () => {
              for (let i = 0; i < 3; i++) {
                try {
                  const r = await fetch('https://cgv.co.kr/api/v1/booking/searchAtktTopPostrList?coCd=A420');
                  return (await r.json()).data || [];
                } catch (e) {
                  if (i === 2) return [];
                  await new Promise(res => setTimeout(res, 2000));
                }
              }
            });

            let stateChanged = false;

            for (const keyword of keywords) {
              if (isDone(keyword)) continue;
              const movie = chart.find(m => m.movNm.includes(keyword));
              if (!movie) {
                console.log(`"${keyword}": 아직 CGV 차트에 없음 — 스킵`);
                continue;
              }

              for (const [siteName, siteNo] of Object.entries(SITES)) {
                const stateKey = `${keyword}|${siteName}`;
                if (state[stateKey] === true) continue;

                const dates = await page.evaluate(async ({ movNo, siteNo }) => {
                  for (let i = 0; i < 3; i++) {
                    try {
                      const r = await fetch(`https://cgv.co.kr/api/v1/booking/searchSiteScnscYmdListByMov?coCd=A420&movNo=${movNo}&siteNo=${siteNo}`);
                      return (await r.json()).data || [];
                    } catch (e) {
                      if (i === 2) return [];
                      await new Promise(res => setTimeout(res, 2000));
                    }
                  }
                }, { movNo: movie.movNo, siteNo });

                if (dates.length > 0) {
                  console.log(`"${keyword}" @ CGV ${siteName}: 예매 오픈 확인 (${dates.length}개 상영일)`);
                  const content = `🎬 예매 오픈!\n영화: ${movie.movNm}\n극장: CGV ${siteName}\n상영일: ${dates.map(d => d.scnYmd).join(', ')}`;
                  const res = await fetch(process.env.DISCORD_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                  });
                  console.log('Discord 응답 상태:', res.status);
                  state[stateKey] = true;
                  stateChanged = true;
                } else {
                  console.log(`"${keyword}" @ CGV ${siteName}: 아직 미오픈`);
                }
              }
            }

            await browser.close();
            if (stateChanged) fs.writeFileSync(STATE_FILE, JSON.stringify(state, null, 2));
          })();
          SCRIPT_EOF
          node check_cgv.js

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cgv-failure-evidence
          path: |
            cgv_failure.png
            cgv_failure.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain cgv_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add cgv_state.json
            git commit -m "chore: update CGV booking state"
            # 다른 워크플로우가 먼저 push했을 수 있으므로 rebase 후 push, 실패 시 재시도.
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
              sleep 3
            done
            exit 1
          else
            echo "상태 변경 없음"
          fi

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -H 'Content-Type: application/json' \
            -d "{\"content\":\"⚠️ CGV 예매 감시 실패 — 알림이 누락될 수 있음\n$RUN_URL\"}" \
            "$DISCORD_WEBHOOK" || true
