name: CGV 예매 오픈 감시

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cgv-booking-watch
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 대기하다 시작한 실행은 트리거 시점의 옛 커밋을 받는다(앞 실행이 방금 올린 상태 커밋이 빠져 push 때 충돌).
      # 그래서 job이 시작되는 시점의 브랜치 최신 끝을 받는다.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # 설치 단계의 네트워크 실패(ECONNRESET 등)가 스크립트의 연속 실패 규칙 밖에서 실행을 실패시키므로,
      # node_modules를 캐시해 적중하면 npm을 건너뛰고, 미스면 재시도한다. 버전은 고정한다(캐시 키와 같이 올릴 것).
      # 브라우저 없이 요청만 사용한다(설치 단계 없음).
      - name: Check CGV booking status and notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # cgv.co.kr은 GitHub 러너(해외·데이터센터 IP)를 403으로 막는다 → Cloudflare Worker 중계(relay/README_CGV.md)를 거친다.
          CGV_RELAY_URL: ${{ secrets.CGV_RELAY_URL }}
          CGV_RELAY_TOKEN: ${{ secrets.CGV_RELAY_TOKEN }}
        run: |
          cat > check_cgv.js << 'SCRIPT_EOF'
          const fs = require('fs');

          // 조용한 실패 방지: 차단(403)·HTML 오류 페이지·형식이 다른 응답을 "상영 없음"으로 넘기지 않고 실패로 센다.
          const failures = []; // 이번 실행에서 못 끝낸 조회(사유 문자열)
          let okCalls = 0;     // 이번 실행에서 정상 형식으로 받은 조회 수
          const bodyHead = t => t.slice(0, 80).replace(/\s+/g, ' ');

          const KEYWORDS_FILE = 'keywords.txt';
          const THEATERS_FILE = 'theaters.txt';
          const STATE_FILE = 'cgv_state.json';
          const RELAY_URL = (process.env.CGV_RELAY_URL || '').trim().replace(/\/+$/, '');
          const BASE = RELAY_URL || 'https://cgv.co.kr';
          const RELAY_HEADERS = RELAY_URL ? { 'X-Relay-Token': (process.env.CGV_RELAY_TOKEN || '').trim() } : {};
          // cron 간격 안에 끝내기 위한 실행 시간 상한. 넘으면 중단하고 실패로 센다.
          const DEADLINE = Date.now() + 4 * 60 * 1000;
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          const GROWTH = 4;       // 같은 날짜의 일반 회차가 이만큼 이상 늘면 "회차 추가 오픈"으로 알림
          const FOLLOW_DAYS = 7;  // 첫 알림 후 이 기간 동안만 새 날짜/추가 회차를 추적
          // 시사회·GV·무대인사·프리미어 같은 특별 상영도 일반 회차와 똑같이 센다(제외하지 않는다).
          // 다만 알림에서 구별되도록 그런 표기가 붙은 이름은 따로 모아 메시지에 보여 준다.
          const LABEL_RE = /프리미어|무대인사|GV|시사|관객과의|스페셜|커튼콜|라이브|특별|상영회|팬미팅|팬 미팅|^\[/i;

          function loadLines(file) {
            if (!fs.existsSync(file)) return [];
            return fs.readFileSync(file, 'utf8').split('\n').map(s => s.trim()).filter(Boolean);
          }

          function loadCgvSites() {
            const sites = {};
            for (const line of loadLines(THEATERS_FILE)) {
              const [chain, name, code] = line.split(',').map(s => s.trim());
              if (chain === 'CGV' && name && code) sites[name] = code;
            }
            return sites;
          }

          const kstToday = () => new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
          const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
          const fmtDate = s => s.replace(/(\d{4})-?(\d{2})-?(\d{2})/, '$1-$2-$3');

          // state[key]: 없음(미알림) | true(예전 방식으로 알림 완료) | { since, dates: { 'YYYY-MM-DD': 일반 회차 수 } }
          // 첫 알림 이후(추적 단계)에는 15분에 한 번만 조회하고, FOLLOW_DAYS가 지나면 추적을 끝낸다.
          function shouldCheck(entry, today, followUpRun) {
            if (!entry) return true;
            if (entry !== true && daysBetween(entry.since, today) > FOLLOW_DAYS) return false;
            return followUpRun;
          }

          function evaluate(entry, cur, today) {
            const silent = entry === true; // 예전 방식 상태는 알림 없이 현재 상태를 기준선으로만 채택
            const next = entry && entry !== true ? { since: entry.since, dates: { ...entry.dates } } : { since: today, dates: {} };
            const events = [];
            // cur에는 "조회에 성공한 날짜"만 들어 있다(실패한 날짜는 없음). 0회는 그 날짜가 닫혀 있다는 뜻.
            for (const [d, c] of Object.entries(cur)) {
              const p = next.dates[d];
              if (c <= 0) { delete next.dates[d]; continue; } // 닫힌 날짜는 기준선에서 제거 → 다시 열리면 새로 알림
              if (p === undefined) {
                if (!silent) events.push({ date: d, count: c, kind: 'new' });
                next.dates[d] = c;
              } else if (!silent && c >= p + GROWTH) {
                events.push({ date: d, count: c, kind: 'more', added: c - p });
                next.dates[d] = c;
              } else if (c < p / 2) {
                next.dates[d] = c; // 회차가 절반 아래로 급감하면 기준선을 낮춰, 부풀려진 기준선이 이후 알림을 막지 않게 함
              }
            }
            for (const d of Object.keys(next.dates)) if (d < today) delete next.dates[d];
            return { events, next };
          }

          function buildMessage(movie, label, theater, events, tags = []) {
            const news = events.filter(e => e.kind === 'new');
            const more = events.filter(e => e.kind === 'more');
            const title = news.length ? '🎬 예매 오픈!' : '🎟 회차 추가 오픈!';
            const dates = news.length
              ? news.map(e => `${e.date} (${e.count}회)`).join(', ')
              : more.map(e => `${e.date} (+${e.added}회)`).join(', ');
            let msg = `${title}\n영화: ${movie}\n극장: ${label} ${theater}\n상영일: ${dates}`;
            if (tags.length) msg += `\n표기: ${tags.slice(0, 5).join(', ')}`; // 프리미어·GV 등 특별 표기가 붙은 회차
            if (news.length && more.length) msg += `\n추가 오픈: ${more.map(e => `${e.date} (+${e.added}회)`).join(', ')}`;
            return msg;
          }

          async function main() {
            const keywords = loadLines(KEYWORDS_FILE);
            const SITES = loadCgvSites();
            if (keywords.length === 0 || Object.keys(SITES).length === 0) {
              console.log('keywords.txt 또는 theaters.txt(CGV)에 감시 대상이 없음. 종료.');
              return;
            }

            const state = fs.existsSync(STATE_FILE) ? JSON.parse(fs.readFileSync(STATE_FILE, 'utf8')) : {};
            const today = kstToday();
            const followUpRun = true; // CGV는 10분 간격으로만 호출하므로 추적 중인 항목도 매번 조회한다
            const siteNames = Object.keys(SITES);
            const todo = keywords.filter(k => siteNames.some(s => shouldCheck(state[`${k}|${s}`], today, followUpRun)));
            if (todo.length === 0) {
              console.log('이번 실행에서 조회할 대상 없음 (추적 대기 또는 추적 종료).');
              return;
            }

            // 정상 응답은 {statusCode: 0, data: [...]} 형식이다. 차단(403) HTML·오류 형식·시간 초과는 재시도 후 null로 돌려
            // "0회(닫힘)"·"차트에 없음"과 구분하고 실패로 센다.
            const getJson = async url => {
              if (Date.now() > DEADLINE) throw new Error('실행 시간 상한(4분) 초과 — CGV 응답 지연으로 중단');
              let last = '';
              for (let i = 0; i < 3; i++) {
                try {
                  const r = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0', ...RELAY_HEADERS }, signal: AbortSignal.timeout(20000) });
                  const t = await r.text();
                  let j = null;
                  try { j = JSON.parse(t); } catch (e) {}
                  if (r.ok && j && j.statusCode === 0 && Array.isArray(j.data)) { okCalls++; return j.data; }
                  last = j ? `HTTP ${r.status}, statusCode=${j.statusCode}` : `비JSON 응답 HTTP ${r.status}: ${bodyHead(t)}`;
                  if (r.status === 401) { last += ' (중계 토큰 불일치 가능성)'; break; }
                  if (r.status === 403 && !RELAY_URL) break; // 직접 접속이 막힌 것은 재시도해도 같다
                } catch (e) {
                  last = e.message;
                }
                if (i < 2) await sleep(2000);
              }
              failures.push(`CGV 요청 실패: ${last}`);
              console.log(`  (CGV 요청 실패: ${last})`);
              return null;
            };

            const chart = await getJson(`${BASE}/api/v1/booking/searchAtktTopPostrList?coCd=A420`);
            if (chart === null || chart.length === 0) {
              // 차트가 비었거나 받지 못하면 키워드가 "없는" 것이 아니라 조회가 안 된 것이다.
              if (chart !== null) { failures.push('CGV 차트가 비어 있음'); okCalls--; }
              console.log('CGV 차트를 가져오지 못해 이번 실행은 조회하지 않음');
              return;
            }
            let stateChanged = false;

            for (const keyword of todo) {
              const movie = chart.find(m => m.movNm.includes(keyword));
              if (!movie) {
                console.log(`"${keyword}": 아직 CGV 차트에 없음 — 스킵`);
                continue;
              }

              for (const [siteName, siteNo] of Object.entries(SITES)) {
                const stateKey = `${keyword}|${siteName}`;
                const entry = state[stateKey];
                const tags = new Set();
                if (!shouldCheck(entry, today, followUpRun)) continue;

                const days = await getJson(`${BASE}/api/v1/booking/searchSiteScnscYmdListByMov?coCd=A420&movNo=${movie.movNo}&siteNo=${siteNo}`);
                if (days === null) {
                  console.log(`"${keyword}" @ CGV ${siteName}: 상영일 조회 실패 — 이번엔 스킵`);
                  continue;
                }
                const cur = {};
                const failed = new Set();
                for (const d of days) {
                  const list = await getJson(`${BASE}/api/v1/booking/searchMovScnInfo?coCd=A420&siteNo=${siteNo}&scnYmd=${d.scnYmd}&movNo=${movie.movNo}&rtctlScopCd=08`);
                  if (list === null) { failed.add(fmtDate(d.scnYmd)); continue; }
                  const mine = list.filter(x => x.movNo === movie.movNo || (x.prodNm || '').includes(keyword));
                  cur[fmtDate(d.scnYmd)] = mine.length;
                  for (const x of mine) if (LABEL_RE.test(x.prodNm || '')) tags.add(x.prodNm.trim());
                }
                // 상영일 목록에서 빠진 날짜(이전에 열려 있었음)는 닫힌 것으로 본다. 단, 이번에 조회 실패한 날짜는 제외.
                for (const d of Object.keys((entry && entry.dates) || {})) if (!(d in cur) && !failed.has(d) && d >= today) cur[d] = 0;

                const { events, next } = evaluate(entry, cur, today);
                if (events.length > 0) {
                  console.log(`"${keyword}" @ CGV ${siteName}: ${events.map(e => `${e.kind} ${e.date}`).join(', ')}`);
                  const res = await fetch(process.env.DISCORD_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: buildMessage(movie.movNm.trim(), 'CGV', siteName, events, [...tags]) })
                  });
                  console.log('Discord 응답 상태:', res.status);
                } else {
                  console.log(`"${keyword}" @ CGV ${siteName}: 새 일반 회차 없음 (조회된 상영일 ${days.length}개)`);
                }
                // 알림이 났거나, 예전 상태 이관이거나, 추적 중 기준선이 바뀐 경우에만 저장
                if (events.length > 0 || entry === true || (entry && JSON.stringify(next) !== JSON.stringify(entry))) {
                  state[stateKey] = next;
                  stateChanged = true;
                }
              }
            }

            if (stateChanged) fs.writeFileSync(STATE_FILE, JSON.stringify(state, null, 2));
          }

          // ---- 실행 결과(연속 실패) 관리 (디트릭스와 같은 규칙) ----
          // 정상 응답을 하나도 못 받고 실패만 있었던 실행을 "실패"로 센다(일부 조회만 간헐적으로 실패하는 것은 정상 범위).
          // 연속 6회와 24회째에만 알리고, 회복하면 한 번 알린다. 조회할 게 없던 실행은 연속 횟수를 건드리지 않는다.
          // 연속 실패 상태는 cgv_state.json의 "_health" 키에 저장한다.
          const HEALTH_FILE = 'cgv_state.json';
          const HEALTH_LABEL = 'CGV';
          const CRON_MIN = 10; // 호출 주기(분) — 알림 문구의 "약 N분" 계산용(중계를 거치는 우회라 접속량을 줄여 10분)
          const ALERT_AT = [2, 6]; // 10분 주기이므로 연속 2회(≈20분)째와 6회(≈1시간)째에 알린다
          const kst = ms => new Date(ms + 9 * 60 * 60 * 1000).toISOString().replace('T', ' ').slice(0, 16) + ' KST';

          // prev: 저장된 _health. failed: 이번 실행이 실패인지. 반환: { health, messages }
          function nextHealth(prev, failed, errText, nowMs) {
            const p = prev || { consecutive_failures: 0 };
            const messages = [];
            if (!failed) {
              if (p.consecutive_failures > 0 && p.alerted) {
                const minutes = Math.round((nowMs - Date.parse(p.first_failure_at)) / 60000);
                messages.push(`✅ ${HEALTH_LABEL} 감시 복구됨 (연속 실패 ${p.consecutive_failures}회, 약 ${minutes}분)`);
              }
              return { health: { consecutive_failures: 0 }, messages };
            }
            const n = p.consecutive_failures + 1;
            const first = p.first_failure_at || new Date(nowMs).toISOString();
            let alerted = !!p.alerted;
            if (ALERT_AT.includes(n)) {
              messages.push(`⚠️ ${HEALTH_LABEL} 감시 연속 실패 ${n}회 (약 ${n * CRON_MIN}분)\n첫 실패: ${kst(Date.parse(first))}\n마지막 오류: ${errText.slice(0, 200)}` + (n === ALERT_AT[0] ? `\n(계속되면 ${ALERT_AT[1]}회째에 한 번 더 알립니다)` : ''));
              alerted = true;
            }
            return { health: { consecutive_failures: n, first_failure_at: first, last_error: errText.slice(0, 200), alerted }, messages };
          }

          async function run() {
            let fatal = null;
            try { await main(); } catch (e) { fatal = e; }
            if (fatal) console.log(fatal.stack || fatal.message);
            const failed = !!fatal || (failures.length > 0 && okCalls === 0);
            const idle = !fatal && failures.length === 0 && okCalls === 0;
            if (idle) return;
            const errText = fatal ? fatal.message : (failures[failures.length - 1] || '');
            if (failed) console.log(`이번 실행은 실패로 집계: ${errText} (조회 실패 ${failures.length}건)`);
            else if (failures.length) console.log(`조회 실패 ${failures.length}건이 있었지만 정상 응답도 ${okCalls}건 받아 실패로 세지 않음`);

            const state = fs.existsSync(HEALTH_FILE) ? JSON.parse(fs.readFileSync(HEALTH_FILE, 'utf8')) : {};
            const { health, messages } = nextHealth(state._health, failed, errText, Date.now());
            for (const content of messages) {
              const res = await fetch(process.env.DISCORD_WEBHOOK, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content })
              });
              console.log('Discord 응답 상태:', res.status);
            }
            // 한 번도 실패한 적 없으면 파일에 _health를 만들지 않는다(불필요한 커밋 방지).
            if (state._health || failed) {
              state._health = health;
              fs.writeFileSync(HEALTH_FILE, JSON.stringify(state, null, 2));
            }
          }

          run();
          SCRIPT_EOF
          node check_cgv.js

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain cgv_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add cgv_state.json
            git commit -m "chore: update CGV booking state"
            # 다른 워크플로우가 먼저 push했을 수 있으므로 rebase 후 push, 실패 시 재시도.
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
              sleep 3
            done
            exit 1
          else
            echo "상태 변경 없음"
          fi

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -H 'Content-Type: application/json' \
            -d "{\"content\":\"⚠️ CGV 예매 감시 실패 — 알림이 누락될 수 있음\n$RUN_URL\"}" \
            "$DISCORD_WEBHOOK" || true
