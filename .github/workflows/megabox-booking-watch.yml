name: 메가박스 예매 오픈 감시

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: megabox-booking-watch
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check whether movie-code resolution is needed
        id: precheck
        run: |
          if [ ! -f megabox_movie_cache.json ]; then echo '{}' > megabox_movie_cache.json; fi
          NEED=false
          if [ -f keywords.txt ]; then
            while IFS= read -r kw; do
              [ -z "$kw" ] && continue
              code=$(jq -r --arg k "$kw" '.[$k] // empty' megabox_movie_cache.json)
              if [ -z "$code" ]; then NEED=true; fi
            done < keywords.txt
          fi
          echo "need_resolution=$NEED" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.precheck.outputs.need_resolution == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright
        if: steps.precheck.outputs.need_resolution == 'true'
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Resolve missing movie codes
        if: steps.precheck.outputs.need_resolution == 'true'
        run: |
          cat > resolve_megabox.js << 'SCRIPT_EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const cache = fs.existsSync('megabox_movie_cache.json') ? JSON.parse(fs.readFileSync('megabox_movie_cache.json', 'utf8')) : {};
          const keywords = fs.readFileSync('keywords.txt', 'utf8').split('\n').map(s => s.trim()).filter(Boolean);
          const missing = keywords.filter(k => !cache[k]);

          (async () => {
            console.log('캐시 필요 키워드:', JSON.stringify(missing));
            if (missing.length === 0) { console.log('캐시 필요 없음 — 종료'); return; }
            const browser = await chromium.launch();

            for (const keyword of missing) {
              const page = await browser.newPage();
              let movieNo = null;
              try {
                // 예전에는 영화를 클릭한 뒤 네트워크 요청에서 movieNo를 엿봤는데, 페이지가 기본 선택한 다른 영화
                // (목록 1순위)의 요청이 늦게 나가는 바람에 엉뚱한 영화 번호가 캐시된 사례가 있었다.
                // 영화 목록 버튼에 movieNo가 직접 들어 있으므로(data-movie-no) 클릭 없이 그 값을 읽는다.
                await page.goto('https://www.megabox.co.kr/booking/timetable', { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForSelector('button[data-movie-no]', { timeout: 15000 });
                const movies = await page.$$eval('button[data-movie-no]', bs => bs.map(b => ({
                  name: (b.innerText || b.getAttribute('data-movie-nm') || '').trim(),
                  no: b.getAttribute('data-movie-no')
                })));
                const hit = movies.find(m => m.name === keyword) || movies.find(m => m.name.includes(keyword));
                console.log(`"${keyword}": 영화 목록 ${movies.length}개 중 ${hit ? `"${hit.name}"(${hit.no}) 선택` : '일치 항목 없음'}`);
                if (hit) movieNo = hit.no;
              } catch (e) {
                console.log(`"${keyword}": 메가박스 영화 목록 조회 실패 — ${e.message.split('\n')[0]}`);
              }
              await page.close();
              if (movieNo) {
                cache[keyword] = movieNo;
                console.log(`"${keyword}": movieNo=${movieNo} 확인, 캐시 저장`);
              } else {
                console.log(`"${keyword}": movieNo 확인 실패 (아직 메가박스 목록에 없을 수 있음) — 다음 실행에 재시도`);
              }
            }

            await browser.close();
            fs.writeFileSync('megabox_movie_cache.json', JSON.stringify(cache, null, 2));
            console.log('캐시 파일 저장 완료:', JSON.stringify(cache));
          })();
          SCRIPT_EOF
          node resolve_megabox.js

      - name: Check booking status and notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat > check_megabox.js << 'SCRIPT_EOF'
          const fs = require('fs');

          function loadLines(file) {
            if (!fs.existsSync(file)) return [];
            return fs.readFileSync(file, 'utf8').split('\n').map(s => s.trim()).filter(Boolean);
          }

          function loadMegaboxTheaters() {
            const out = [];
            for (const line of loadLines('theaters.txt')) {
              const parts = line.split(',').map(s => s.trim());
              if (parts[0] === 'MEGABOX' && parts[1] && parts[2]) out.push({ name: parts[1], areaCd: parts[2] });
            }
            return out;
          }

          const GROWTH = 4;       // 같은 날짜의 일반 회차가 이만큼 이상 늘면 "회차 추가 오픈"으로 알림
          const FOLLOW_DAYS = 7;  // 첫 알림 후 이 기간 동안만 새 날짜/추가 회차를 추적
          // 시사회·GV·무대인사 같은 특별 상영은 "일반 예매 오픈"으로 치지 않는다.
          // 메가박스는 특별 상영이 cttsTyDivCdNm=무대인사, movieNm="[무대인사] 제목" 형태로 내려옴(직접 확인).
          const SPECIAL_RE = /무대인사|GV|시사|관객과의|스페셜|커튼콜|라이브|특별|상영회|팬미팅|팬 미팅/i;
          const isSpecial = it => SPECIAL_RE.test([it.movieNm, it.cttsTyDivCdNm, it.movieCttsNm].filter(Boolean).join(' ')) || /^\[/.test(it.movieNm || '');

          const norm = s => (s || '').replace(/&#\d+;|&\w+;/g, '').replace(/[\s()]/g, '');
          const kstToday = () => new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
          const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
          const fmtDate = s => s.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');

          // state[key]: 없음(미알림) | true(예전 방식으로 알림 완료) | { since, dates: { 'YYYY-MM-DD': 일반 회차 수 } }
          // 첫 알림 이후(추적 단계)에는 15분에 한 번만 조회하고, FOLLOW_DAYS가 지나면 추적을 끝낸다.
          function shouldCheck(entry, today, followUpRun) {
            if (!entry) return true;
            if (entry !== true && daysBetween(entry.since, today) > FOLLOW_DAYS) return false;
            return followUpRun;
          }

          function evaluate(entry, cur, today) {
            const silent = entry === true; // 예전 방식 상태는 알림 없이 현재 상태를 기준선으로만 채택
            const next = entry && entry !== true ? { since: entry.since, dates: { ...entry.dates } } : { since: today, dates: {} };
            const events = [];
            // cur에는 "조회에 성공한 날짜"만 들어 있다(실패한 날짜는 없음). 0회는 그 날짜가 닫혀 있다는 뜻.
            for (const [d, c] of Object.entries(cur)) {
              const p = next.dates[d];
              if (c <= 0) { delete next.dates[d]; continue; } // 닫힌 날짜는 기준선에서 제거 → 다시 열리면 새로 알림
              if (p === undefined) {
                if (!silent) events.push({ date: d, count: c, kind: 'new' });
                next.dates[d] = c;
              } else if (!silent && c >= p + GROWTH) {
                events.push({ date: d, count: c, kind: 'more', added: c - p });
                next.dates[d] = c;
              } else if (c < p / 2) {
                next.dates[d] = c; // 회차가 절반 아래로 급감하면 기준선을 낮춰, 부풀려진 기준선이 이후 알림을 막지 않게 함
              }
            }
            for (const d of Object.keys(next.dates)) if (d < today) delete next.dates[d];
            return { events, next };
          }

          function buildMessage(movie, label, theater, events) {
            const news = events.filter(e => e.kind === 'new');
            const more = events.filter(e => e.kind === 'more');
            const title = news.length ? '🎬 예매 오픈!' : '🎟 회차 추가 오픈!';
            const dates = news.length
              ? news.map(e => `${e.date} (${e.count}회)`).join(', ')
              : more.map(e => `${e.date} (+${e.added}회)`).join(', ');
            let msg = `${title}\n영화: ${movie}\n극장: ${label} ${theater}\n상영일: ${dates}`;
            if (news.length && more.length) msg += `\n추가 오픈: ${more.map(e => `${e.date} (+${e.added}회)`).join(', ')}`;
            return msg;
          }

          function nextDates(n) {
            const now = new Date(Date.now() + 9 * 60 * 60 * 1000); // KST
            const out = [];
            for (let i = 0; i <= n; i++) {
              const d = new Date(now);
              d.setDate(d.getDate() + i);
              out.push(d.toISOString().slice(0, 10).replace(/-/g, ''));
            }
            return out;
          }

          // megabox.co.kr이 GitHub Actions발 접속을 간헐적으로 커넥션 타임아웃시킴(반복 확인됨).
          // 재시도 없이 예외가 나면 전체 스크립트가 죽어서, 호출 하나당 재시도 + 최종 실패시 스킵 처리.
          async function fetchWithRetry(url, options, attempts = 3, delayMs = 2000) {
            let lastErr;
            for (let i = 0; i < attempts; i++) {
              try {
                return await fetch(url, options);
              } catch (e) {
                lastErr = e;
                if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs));
              }
            }
            throw lastErr;
          }

          async function getSchedule(movieNo, playDe, areaCd) {
            const fd = new URLSearchParams();
            fd.append('masterType', 'movie');
            fd.append('movieNo', movieNo);
            fd.append('movieNo1', movieNo);
            // firstAt=Y는 요청한 playDe를 무시하고 서버가 "실제 첫 상영일"로 덮어써서 응답함
            // (직접 확인함) — 우리가 지정한 날짜를 정확히 조회하려면 반드시 N이어야 함.
            fd.append('firstAt', 'N');
            fd.append('playDe', playDe);
            fd.append('areaCd', areaCd);
            // 짧은 시간에 연속 호출하면 연결을 끊는 것이 확인되어 호출 사이에 간격을 둔다.
            await new Promise(r => setTimeout(r, 300));
            try {
              const r = await fetchWithRetry('https://www.megabox.co.kr/on/oh/ohc/Brch/schedulePage.do', { method: 'POST', body: fd });
              const j = await r.json();
              return (j.megaMap && j.megaMap.movieFormList) || [];
            } catch (e) {
              console.log(`  (areaCd=${areaCd}, playDe=${playDe} 조회 실패, 이번엔 스킵: ${e.message})`);
              return null; // 실패는 "0회(닫힘)"와 구분해서 그 날짜를 이번 판정에서 제외한다
            }
          }

          (async () => {
            const keywords = loadLines('keywords.txt');
            const theaters = loadMegaboxTheaters();
            const cache = fs.existsSync('megabox_movie_cache.json') ? JSON.parse(fs.readFileSync('megabox_movie_cache.json', 'utf8')) : {};
            if (keywords.length === 0 || theaters.length === 0) {
              console.log('keywords.txt 또는 theaters.txt(MEGABOX)에 감시 대상이 없음. 종료.');
              return;
            }

            const state = fs.existsSync('megabox_state.json') ? JSON.parse(fs.readFileSync('megabox_state.json', 'utf8')) : {};
            let stateChanged = false;
            const today = kstToday();
            const followUpRun = new Date().getUTCMinutes() % 15 < 3;
            // 메가박스 상영시간표 화면의 날짜 띠가 오늘~+14일까지라 예매 한도도 그 범위로 판단(브라우저로 확인).
            const dates = nextDates(14);

            for (const keyword of keywords) {
              const movieNo = cache[keyword];
              if (!movieNo) {
                console.log(`"${keyword}": movieNo 아직 미확인 — 스킵 (다음 실행에 재시도)`);
                continue;
              }

              // 조회가 필요 없는 극장(추적 대기/종료)은 제외 — 전부 해당하면 API 호출 자체를 생략
              const pending = theaters.filter(t => shouldCheck(state[`${keyword}|${t.name}`], today, followUpRun));
              if (pending.length === 0) continue;

              const counts = {}; // counts[극장이름][YYYY-MM-DD] = 일반 회차 수 (조회 성공한 날짜만, 0 포함)
              const samples = {}; // 알림 근거 확인용 로그
              for (const areaCd of new Set(pending.map(t => t.areaCd))) {
                const targets = pending.filter(t => t.areaCd === areaCd);
                for (const playDe of dates) {
                  const list = await getSchedule(movieNo, playDe, areaCd);
                  if (list === null) continue;
                  // 캐시된 movieNo가 키워드와 다른 영화면(과거에 실제로 발생) 이 날짜는 판정하지 않고 경고만 남긴다.
                  const same = list.filter(it => [it.movieNo, it.rpstMovieNo].includes(movieNo));
                  if (same.length > 0 && !same.some(it => norm(it.rpstMovieNm || it.movieNm).includes(norm(keyword)))) {
                    console.log(`  ⚠ movieNo=${movieNo}의 영화명("${same[0].rpstMovieNm || same[0].movieNm}")이 키워드 "${keyword}"와 다름 — 캐시 확인 필요, ${playDe} 판정 제외`);
                    continue;
                  }
                  for (const theater of targets) {
                    // 응답 항목 자신의 영화(movieNo/rpstMovieNo)가 요청한 영화이고, 상영일(playDe)이 요청한 날짜와 같고,
                    // 실제로 예매 가능한 회차만 센다. (서버가 요청한 영화 대신 다른 영화 회차를 섞어 내려준 사례 확인됨:
                    // "가능한 사랑" 조회에 "암살자(들)" 회차가 포함되어 수원스타필드에서 허위 알림 발생)
                    const hits = list.filter(it =>
                      (it.brchNm || '').includes(theater.name) && it.playDe === playDe &&
                      [it.movieNo, it.rpstMovieNo].includes(movieNo) &&
                      it.bokdAbleAt === 'Y' && it.brchBokdUnableAt !== 'Y' && !isSpecial(it));
                    (counts[theater.name] = counts[theater.name] || {})[fmtDate(playDe)] = hits.length;
                    if (hits.length > 0) (samples[theater.name] = samples[theater.name] || {})[fmtDate(playDe)] = hits.slice(0, 3).map(it => `${it.brchNm} ${it.playStartTime} ${it.movieNm}(${it.movieNo}/${it.rpstMovieNo}) bokd=${it.bokdAbleAt}`);
                  }
                }
              }

              for (const theater of pending) {
                const stateKey = `${keyword}|${theater.name}`;
                const entry = state[stateKey];

                const { events, next } = evaluate(entry, counts[theater.name] || {}, today);
                if (events.length > 0) {
                  console.log(`"${keyword}" @ 메가박스 ${theater.name}: ${events.map(e => `${e.kind} ${e.date}`).join(', ')}`);
                  for (const e of events) console.log(`  근거 ${e.date}: ${JSON.stringify((samples[theater.name] || {})[e.date])}`);
                  const res = await fetch(process.env.DISCORD_WEBHOOK, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: buildMessage(keyword, '메가박스', theater.name, events) })
                  });
                  console.log('Discord 응답 상태:', res.status);
                } else {
                  console.log(`"${keyword}" @ 메가박스 ${theater.name}: 새 일반 회차 없음`);
                }
                // 알림이 났거나, 예전 상태 이관이거나, 추적 중 기준선이 바뀐 경우에만 저장
                if (events.length > 0 || entry === true || (entry && JSON.stringify(next) !== JSON.stringify(entry))) {
                  state[stateKey] = next;
                  stateChanged = true;
                }
              }
            }

            if (stateChanged) fs.writeFileSync('megabox_state.json', JSON.stringify(state, null, 2));
          })();
          SCRIPT_EOF
          node check_megabox.js

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TARGETS=""
          for f in megabox_state.json megabox_movie_cache.json; do
            if [ -f "$f" ]; then
              git add "$f"
              TARGETS="$TARGETS $f"
            fi
          done
          if [ -n "$TARGETS" ] && [ -n "$(git status --porcelain -- $TARGETS)" ]; then
            git commit -m "chore: update Megabox booking state/cache"
            # 다른 워크플로우가 먼저 push했을 수 있으므로 rebase 후 push, 실패 시 재시도.
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
              sleep 3
            done
            exit 1
          else
            echo "상태 변경 없음"
          fi

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -H 'Content-Type: application/json' \
            -d "{\"content\":\"⚠️ 메가박스 예매 감시 실패 — 알림이 누락될 수 있음\n$RUN_URL\"}" \
            "$DISCORD_WEBHOOK" || true
