name: 메가박스 예매 오픈 감시

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: megabox-booking-watch
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 대기하다 시작한 실행은 트리거 시점의 옛 커밋을 받는다(앞 실행이 방금 올린 상태 커밋이 빠져 push 때 충돌).
      # 그래서 job이 시작되는 시점의 브랜치 최신 끝을 받는다.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # 키워드 해결을 마지막으로 시도한 시각(15분 간격 재시도용)은 알림 판단과 무관한 휘발성 값이라 git에 커밋하지 않고
      # actions/cache에 둔다(키에 run_id를 붙여 저장하고 restore-keys로 가장 최근 것을 복원). 캐시가 없어도 안전하다:
      # 그때는 바로 다시 시도할 뿐이다.
      - name: Restore resolve-attempt times
        uses: actions/cache/restore@v5
        with:
          path: megabox_resolve_attempts.json
          key: megabox-resolve-attempts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            megabox-resolve-attempts-

      - name: Check whether movie-code resolution is needed
        id: precheck
        run: |
          cat > resolve_due.js << 'SCRIPT_EOF'
          // 영화 코드를 아직 못 찾은 키워드 중 "지금 다시 시도할 차례"인 것만 resolve_due.json에 적는다.
          // 처음 보는 키워드는 바로, 이미 시도한 키워드는 마지막 시도 14분 뒤부터(15분 간격, 3분 주기의 지터를 감안).
          // 그 사이 실행에서는 Chromium 설치와 이름 찾기를 건너뛰고 이미 찾은 코드로만 감시한다.
          const fs = require('fs');
          const RETRY_MS = 14 * 60 * 1000;
          const readJson = (f, d) => fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, 'utf8')) : d;
          const keywords = fs.existsSync('keywords.txt') ? fs.readFileSync('keywords.txt', 'utf8').split('\n').map(s => s.trim()).filter(Boolean) : [];
          const cache = readJson('megabox_movie_cache.json', {});
          const attempts = readJson('megabox_resolve_attempts.json', null) || readJson('megabox_state.json', {})._resolve || {};
          const now = Date.now();
          const missing = keywords.filter(k => !cache[k]);
          const due = missing.filter(k => !(attempts[k] && now - Date.parse(attempts[k]) < RETRY_MS));
          fs.writeFileSync('resolve_due.json', JSON.stringify(due));
          console.log(`미해결 ${missing.length}개, 이번에 시도할 것 ${due.length}개:`, JSON.stringify(due));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `need_resolution=${due.length > 0}\n`);
          SCRIPT_EOF
          node resolve_due.js

      # 설치 단계의 네트워크 실패(ECONNRESET 등)가 스크립트의 연속 실패 규칙 밖에서 실행을 실패시키므로,
      # node_modules를 캐시해 적중하면 npm을 건너뛰고, 미스면 재시도한다. 버전은 고정한다(캐시 키와 같이 올릴 것).
      - name: Cache node_modules
        id: npm-cache
        if: steps.precheck.outputs.need_resolution == 'true'
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-playwright-core-1.64.1

      - name: Install Playwright
        if: steps.precheck.outputs.need_resolution == 'true' && steps.npm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5  # npm이 멈춰도 몇 분 안에 failure로 끝나 실패 알림이 가게 함
        run: |
          npm init -y
          for i in 1 2 3; do
            npm install playwright-core@1.64.1 --fetch-retries=5 --fetch-retry-mintimeout=5000 --fetch-retry-maxtimeout=60000 && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done

      - name: Check Chrome
        if: steps.precheck.outputs.need_resolution == 'true'
        run: google-chrome --version  # 러너에 미리 깔린 Chrome 사용(브라우저·apt 설치 없음)

      - name: Resolve missing movie codes
        if: steps.precheck.outputs.need_resolution == 'true'
        run: |
          cat > resolve_megabox.js << 'SCRIPT_EOF'
          const { chromium } = require('playwright-core');
          const fs = require('fs');

          const cache = fs.existsSync('megabox_movie_cache.json') ? JSON.parse(fs.readFileSync('megabox_movie_cache.json', 'utf8')) : {};
          const state = fs.existsSync('megabox_state.json') ? JSON.parse(fs.readFileSync('megabox_state.json', 'utf8')) : {};
          // 키워드별 마지막 시도 시각 — 15분에 한 번만 다시 시도하려는 기록(커밋하지 않는 megabox_resolve_attempts.json, 예전 상태 파일의 _resolve는 이어받는다)
          const attempts = (fs.existsSync('megabox_resolve_attempts.json') ? JSON.parse(fs.readFileSync('megabox_resolve_attempts.json', 'utf8')) : state._resolve) || {};
          // 앞 단계(resolve_due.js)가 "지금 시도할 차례"인 키워드만 골라 둔다.
          const due = JSON.parse(fs.readFileSync('resolve_due.json', 'utf8'));

          (async () => {
            console.log('이번에 시도할 키워드:', JSON.stringify(due));
            if (due.length === 0) { console.log('시도할 키워드 없음 — 종료'); return; }
            const browser = await chromium.launch({ channel: 'chrome' });

            for (const keyword of due) {
              const page = await browser.newPage();
              let movieNo = null;
              try {
                // 예전에는 영화를 클릭한 뒤 네트워크 요청에서 movieNo를 엿봤는데, 페이지가 기본 선택한 다른 영화
                // (목록 1순위)의 요청이 늦게 나가는 바람에 엉뚱한 영화 번호가 캐시된 사례가 있었다.
                // 영화 목록 버튼에 movieNo가 직접 들어 있으므로(data-movie-no) 클릭 없이 그 값을 읽는다.
                await page.goto('https://www.megabox.co.kr/booking/timetable', { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForSelector('button[data-movie-no]', { timeout: 15000 });
                const movies = await page.$$eval('button[data-movie-no]', bs => bs.map(b => ({
                  name: (b.innerText || b.getAttribute('data-movie-nm') || '').trim(),
                  no: b.getAttribute('data-movie-no')
                })));
                const hit = movies.find(m => m.name === keyword) || movies.find(m => m.name.includes(keyword));
                console.log(`"${keyword}": 영화 목록 ${movies.length}개 중 ${hit ? `"${hit.name}"(${hit.no}) 선택` : '일치 항목 없음'}`);
                if (hit) movieNo = hit.no;
              } catch (e) {
                console.log(`"${keyword}": 메가박스 영화 목록 조회 실패 — ${e.message.split('\n')[0]}`);
              }
              await page.close();
              if (movieNo) {
                cache[keyword] = movieNo;
                delete attempts[keyword];
                console.log(`"${keyword}": movieNo=${movieNo} 확인, 캐시 저장`);
              } else {
                attempts[keyword] = new Date().toISOString();
                console.log(`"${keyword}": movieNo 확인 실패 (아직 메가박스 목록에 없을 수 있음) — 약 15분 뒤 재시도`);
              }
            }

            await browser.close();
            fs.writeFileSync('megabox_movie_cache.json', JSON.stringify(cache, null, 2));
            console.log('캐시 파일 저장 완료:', JSON.stringify(cache));
            // 시도 기록은 커밋하지 않는 파일에 둔다(매 실행 시각만 바뀌어 하루 수백 건의 상태 커밋이 생기던 것을 막는다).
            fs.writeFileSync('megabox_resolve_attempts.json', JSON.stringify(attempts));
            // 예전 방식으로 상태 파일에 남아 있던 _resolve는 한 번만 지운다.
            if (state._resolve) { delete state._resolve; fs.writeFileSync('megabox_state.json', JSON.stringify(state, null, 2)); }
          })();
          SCRIPT_EOF
          node resolve_megabox.js

      - name: Save resolve-attempt times
        if: always() && steps.precheck.outputs.need_resolution == 'true' && hashFiles('megabox_resolve_attempts.json') != ''
        uses: actions/cache/save@v5
        with:
          path: megabox_resolve_attempts.json
          key: megabox-resolve-attempts-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check booking status and notify Discord
        timeout-minutes: 6  # 조회가 멈춰도 job 전체(15분)가 아니라 몇 분 안에 끝나 실패 알림이 가게 함
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat > check_megabox.js << 'SCRIPT_EOF'
          const fs = require('fs');

          // 조용한 실패 방지: 차단(403)·HTML 오류 페이지·형식이 다른 응답을 "상영 없음"으로 넘기지 않고 실패로 센다.
          const failures = []; // 이번 실행에서 못 끝낸 조회(사유 문자열)
          let okCalls = 0;     // 이번 실행에서 정상 형식으로 받은 조회 수
          // cron 간격(3분)을 크게 넘기지 않도록 실행 시간 상한. 넘으면 남은 조회를 포기하고 이번 실행을 실패로 센다.
          const DEADLINE = Date.now() + 4 * 60 * 1000;
          const bodyHead = t => t.slice(0, 80).replace(/\s+/g, ' ');

          function loadLines(file) {
            if (!fs.existsSync(file)) return [];
            return fs.readFileSync(file, 'utf8').split('\n').map(s => s.trim()).filter(Boolean);
          }

          function loadMegaboxTheaters() {
            const out = [];
            for (const line of loadLines('theaters.txt')) {
              const parts = line.split(',').map(s => s.trim());
              if (parts[0] === 'MEGABOX' && parts[1] && parts[2]) out.push({ name: parts[1], areaCd: parts[2] });
            }
            return out;
          }

          const GROWTH = 4;       // 같은 날짜의 일반 회차가 이만큼 이상 늘면 "회차 추가 오픈"으로 알림
          const FOLLOW_DAYS = 7;  // 첫 알림 후 이 기간 동안만 새 날짜/추가 회차를 추적
          // 시사회·GV·무대인사·프리미어 같은 특별 상영도 일반 회차와 똑같이 센다(제외하지 않는다).
          // 다만 알림에서 구별되도록 그런 표기가 붙은 이름은 따로 모아 메시지에 보여 준다.
          const LABEL_RE = /프리미어|무대인사|GV|시사|관객과의|스페셜|커튼콜|라이브|특별|상영회|팬미팅|팬 미팅|^\[/i;
          const labelsOf = it => [it.movieNm, it.cttsTyDivCdNm, it.movieCttsNm].filter(f => f && LABEL_RE.test(f)).map(f => String(f).trim());

          const norm = s => (s || '').replace(/&#\d+;|&\w+;/g, '').replace(/[\s()]/g, '');
          const kstToday = () => new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
          const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
          const fmtDate = s => s.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');

          // state[key]: 없음(미알림) | true(예전 방식으로 알림 완료) | { since, dates: { 'YYYY-MM-DD': 일반 회차 수 } }
          // 첫 알림 이후(추적 단계)에는 15분에 한 번만 조회하고, FOLLOW_DAYS가 지나면 추적을 끝낸다.
          function shouldCheck(entry, today, followUpRun) {
            if (!entry) return true;
            if (entry !== true && daysBetween(entry.since, today) > FOLLOW_DAYS) return false;
            return followUpRun;
          }

          function evaluate(entry, cur, today) {
            const silent = entry === true; // 예전 방식 상태는 알림 없이 현재 상태를 기준선으로만 채택
            const next = entry && entry !== true ? { since: entry.since, dates: { ...entry.dates } } : { since: today, dates: {} };
            const events = [];
            // cur에는 "조회에 성공한 날짜"만 들어 있다(실패한 날짜는 없음). 0회는 그 날짜가 닫혀 있다는 뜻.
            for (const [d, c] of Object.entries(cur)) {
              const p = next.dates[d];
              if (c <= 0) { delete next.dates[d]; continue; } // 닫힌 날짜는 기준선에서 제거 → 다시 열리면 새로 알림
              if (p === undefined) {
                if (!silent) events.push({ date: d, count: c, kind: 'new' });
                next.dates[d] = c;
              } else if (!silent && c >= p + GROWTH) {
                events.push({ date: d, count: c, kind: 'more', added: c - p });
                next.dates[d] = c;
              } else if (c < p / 2) {
                next.dates[d] = c; // 회차가 절반 아래로 급감하면 기준선을 낮춰, 부풀려진 기준선이 이후 알림을 막지 않게 함
              }
            }
            for (const d of Object.keys(next.dates)) if (d < today) delete next.dates[d];
            return { events, next };
          }

          function buildMessage(movie, label, theater, events, tags = []) {
            const news = events.filter(e => e.kind === 'new');
            const more = events.filter(e => e.kind === 'more');
            const title = news.length ? '🎬 예매 오픈!' : '🎟 회차 추가 오픈!';
            const dates = news.length
              ? news.map(e => `${e.date} (${e.count}회)`).join(', ')
              : more.map(e => `${e.date} (+${e.added}회)`).join(', ');
            let msg = `${title}\n영화: ${movie}\n극장: ${label} ${theater}\n상영일: ${dates}`;
            if (tags.length) msg += `\n표기: ${tags.slice(0, 5).join(', ')}`; // 프리미어·GV 등 특별 표기가 붙은 회차
            if (news.length && more.length) msg += `\n추가 오픈: ${more.map(e => `${e.date} (+${e.added}회)`).join(', ')}`;
            return msg;
          }

          function nextDates(n) {
            const now = new Date(Date.now() + 9 * 60 * 60 * 1000); // KST
            const out = [];
            for (let i = 0; i <= n; i++) {
              const d = new Date(now);
              d.setDate(d.getDate() + i);
              out.push(d.toISOString().slice(0, 10).replace(/-/g, ''));
            }
            return out;
          }

          // megabox.co.kr이 GitHub Actions발 접속을 간헐적으로 커넥션 타임아웃시킴(반복 확인됨).
          // 재시도 없이 예외가 나면 전체 스크립트가 죽어서, 호출 하나당 재시도 + 최종 실패시 스킵 처리.
          async function fetchWithRetry(url, options, attempts = 3, delayMs = 2000) {
            let lastErr;
            for (let i = 0; i < attempts; i++) {
              try {
                return await fetch(url, { ...options, signal: AbortSignal.timeout(15000) }); // 응답이 안 오면 끊는다(예전엔 무한정 기다려 job이 15분 타임아웃까지 멈췄다)
              } catch (e) {
                lastErr = e;
                if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs));
              }
            }
            throw lastErr;
          }

          async function getSchedule(movieNo, playDe, areaCd) {
            if (Date.now() > DEADLINE) throw new Error('실행 시간 상한(4분) 초과 — 응답 지연으로 중단');
            const fd = new URLSearchParams();
            fd.append('masterType', 'movie');
            fd.append('movieNo', movieNo);
            fd.append('movieNo1', movieNo);
            // firstAt=Y는 요청한 playDe를 무시하고 서버가 "실제 첫 상영일"로 덮어써서 응답함
            // (직접 확인함) — 우리가 지정한 날짜를 정확히 조회하려면 반드시 N이어야 함.
            fd.append('firstAt', 'N');
            fd.append('playDe', playDe);
            fd.append('areaCd', areaCd);
            // 짧은 시간에 연속 호출하면 연결을 끊는 것이 확인되어 호출 사이에 간격을 둔다.
            await new Promise(r => setTimeout(r, 300));
            try {
              const r = await fetchWithRetry('https://www.megabox.co.kr/on/oh/ohc/Brch/schedulePage.do', { method: 'POST', body: fd });
              const t = await r.text();
              let j = null;
              try { j = JSON.parse(t); } catch (e) {}
              if (!r.ok || !j) throw new Error(`비JSON 응답 (HTTP ${r.status}): ${bodyHead(t)}`);
              // 정상이면 상영이 없어도 statCd 0에 movieFormList가 빈 배열로 온다.
              if (j.statCd !== 0 || !j.megaMap || !Array.isArray(j.megaMap.movieFormList)) throw new Error(`응답 형식 이상: statCd=${j.statCd} ${j.msg || ''}`);
              okCalls++;
              return j.megaMap.movieFormList;
            } catch (e) {
              console.log(`  (areaCd=${areaCd}, playDe=${playDe} 조회 실패, 이번엔 스킵: ${e.message})`);
              failures.push(`areaCd=${areaCd}, playDe=${playDe} 조회 실패: ${e.message}`);
              return null; // 실패는 "0회(닫힘)"와 구분해서 그 날짜를 이번 판정에서 제외한다
            }
          }

          async function main() {
            const keywords = loadLines('keywords.txt');
            const theaters = loadMegaboxTheaters();
            const cache = fs.existsSync('megabox_movie_cache.json') ? JSON.parse(fs.readFileSync('megabox_movie_cache.json', 'utf8')) : {};
            if (keywords.length === 0 || theaters.length === 0) {
              console.log('keywords.txt 또는 theaters.txt(MEGABOX)에 감시 대상이 없음. 종료.');
              return;
            }

            const state = fs.existsSync('megabox_state.json') ? JSON.parse(fs.readFileSync('megabox_state.json', 'utf8')) : {};
            let stateChanged = false;
            const today = kstToday();
            const followUpRun = new Date().getUTCMinutes() % 15 < 3;
            // 메가박스 상영시간표 화면의 날짜 띠가 오늘~+14일까지라 예매 한도도 그 범위로 판단(브라우저로 확인).
            const dates = nextDates(14);

            for (const keyword of keywords) {
              const movieNo = cache[keyword];
              if (!movieNo) {
                console.log(`"${keyword}": movieNo 아직 미확인 — 스킵 (다음 실행에 재시도)`);
                continue;
              }

              // 조회가 필요 없는 극장(추적 대기/종료)은 제외 — 전부 해당하면 API 호출 자체를 생략
              const pending = theaters.filter(t => shouldCheck(state[`${keyword}|${t.name}`], today, followUpRun));
              if (pending.length === 0) continue;

              const counts = {}; // counts[극장이름][YYYY-MM-DD] = 일반 회차 수 (조회 성공한 날짜만, 0 포함)
              const samples = {}; // 알림 근거 확인용 로그
              const tagsBy = {};  // tagsBy[극장이름] = 특별 표기가 붙은 이름 모음
              for (const areaCd of new Set(pending.map(t => t.areaCd))) {
                const targets = pending.filter(t => t.areaCd === areaCd);
                for (const playDe of dates) {
                  const list = await getSchedule(movieNo, playDe, areaCd);
                  if (list === null) continue;
                  // 캐시된 movieNo가 키워드와 다른 영화면(과거에 실제로 발생) 이 날짜는 판정하지 않고 경고만 남긴다.
                  const same = list.filter(it => [it.movieNo, it.rpstMovieNo].includes(movieNo));
                  if (same.length > 0 && !same.some(it => norm(it.rpstMovieNm || it.movieNm).includes(norm(keyword)))) {
                    console.log(`  ⚠ movieNo=${movieNo}의 영화명("${same[0].rpstMovieNm || same[0].movieNm}")이 키워드 "${keyword}"와 다름 — 캐시 확인 필요, ${playDe} 판정 제외`);
                    continue;
                  }
                  for (const theater of targets) {
                    // 응답 항목 자신의 영화(movieNo/rpstMovieNo)가 요청한 영화이고, 상영일(playDe)이 요청한 날짜와 같고,
                    // 실제로 예매 가능한 회차만 센다. (서버가 요청한 영화 대신 다른 영화 회차를 섞어 내려준 사례 확인됨:
                    // "가능한 사랑" 조회에 "암살자(들)" 회차가 포함되어 수원스타필드에서 허위 알림 발생)
                    const hits = list.filter(it =>
                      (it.brchNm || '').includes(theater.name) && it.playDe === playDe &&
                      [it.movieNo, it.rpstMovieNo].includes(movieNo) &&
                      it.bokdAbleAt === 'Y' && it.brchBokdUnableAt !== 'Y');
                    for (const it of hits) for (const l of labelsOf(it)) (tagsBy[theater.name] = tagsBy[theater.name] || new Set()).add(l);
                    (counts[theater.name] = counts[theater.name] || {})[fmtDate(playDe)] = hits.length;
                    if (hits.length > 0) (samples[theater.name] = samples[theater.name] || {})[fmtDate(playDe)] = hits.slice(0, 3).map(it => `${it.brchNm} ${it.playStartTime} ${it.movieNm}(${it.movieNo}/${it.rpstMovieNo}) bokd=${it.bokdAbleAt}`);
                  }
                }
              }

              for (const theater of pending) {
                const stateKey = `${keyword}|${theater.name}`;
                const entry = state[stateKey];

                const { events, next } = evaluate(entry, counts[theater.name] || {}, today);
                if (events.length > 0) {
                  console.log(`"${keyword}" @ 메가박스 ${theater.name}: ${events.map(e => `${e.kind} ${e.date}`).join(', ')}`);
                  for (const e of events) console.log(`  근거 ${e.date}: ${JSON.stringify((samples[theater.name] || {})[e.date])}`);
                  const res = await fetch(process.env.DISCORD_WEBHOOK, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: buildMessage(keyword, '메가박스', theater.name, events, [...(tagsBy[theater.name] || [])]) })
                  });
                  console.log('Discord 응답 상태:', res.status);
                } else {
                  console.log(`"${keyword}" @ 메가박스 ${theater.name}: 새 일반 회차 없음`);
                }
                // 알림이 났거나, 예전 상태 이관이거나, 추적 중 기준선이 바뀐 경우에만 저장
                if (events.length > 0 || entry === true || (entry && JSON.stringify(next) !== JSON.stringify(entry))) {
                  state[stateKey] = next;
                  stateChanged = true;
                }
              }
            }

            if (stateChanged) fs.writeFileSync('megabox_state.json', JSON.stringify(state, null, 2));
          }

          // ---- 실행 결과(연속 실패) 관리 (디트릭스와 같은 규칙) ----
          // 정상 응답을 하나도 못 받고 실패만 있었던 실행을 "실패"로 센다(일부 조회만 간헐적으로 실패하는 것은 정상 범위).
          // 연속 6회와 24회째에만 알리고, 회복하면 한 번 알린다. 조회할 게 없던 실행은 연속 횟수를 건드리지 않는다.
          // 연속 실패 상태는 megabox_state.json의 "_health" 키에 저장한다.
          const HEALTH_FILE = 'megabox_state.json';
          const HEALTH_LABEL = '메가박스';
          const CRON_MIN = 3; // 호출 주기(분) — 알림 문구의 "약 N분" 계산용
          const ALERT_AT = [6, 24];
          const kst = ms => new Date(ms + 9 * 60 * 60 * 1000).toISOString().replace('T', ' ').slice(0, 16) + ' KST';

          // prev: 저장된 _health. failed: 이번 실행이 실패인지. 반환: { health, messages }
          function nextHealth(prev, failed, errText, nowMs) {
            const p = prev || { consecutive_failures: 0 };
            const messages = [];
            if (!failed) {
              if (p.consecutive_failures > 0 && p.alerted) {
                const minutes = Math.round((nowMs - Date.parse(p.first_failure_at)) / 60000);
                messages.push(`✅ ${HEALTH_LABEL} 감시 복구됨 (연속 실패 ${p.consecutive_failures}회, 약 ${minutes}분)`);
              }
              return { health: { consecutive_failures: 0 }, messages };
            }
            const n = p.consecutive_failures + 1;
            const first = p.first_failure_at || new Date(nowMs).toISOString();
            let alerted = !!p.alerted;
            if (ALERT_AT.includes(n)) {
              messages.push(`⚠️ ${HEALTH_LABEL} 감시 연속 실패 ${n}회 (약 ${n * CRON_MIN}분)\n첫 실패: ${kst(Date.parse(first))}\n마지막 오류: ${errText.slice(0, 200)}` + (n === 6 ? '\n(계속되면 24회째에 한 번 더 알립니다)' : ''));
              alerted = true;
            }
            return { health: { consecutive_failures: n, first_failure_at: first, last_error: errText.slice(0, 200), alerted }, messages };
          }

          async function run() {
            let fatal = null;
            try { await main(); } catch (e) { fatal = e; }
            if (typeof browser !== 'undefined' && browser) await browser.close().catch(() => {});
            if (fatal) console.log(fatal.stack || fatal.message);
            const failed = !!fatal || (failures.length > 0 && okCalls === 0);
            const idle = !fatal && failures.length === 0 && okCalls === 0;
            if (idle) return;
            const errText = fatal ? fatal.message : (failures[failures.length - 1] || '');
            if (failed) console.log(`이번 실행은 실패로 집계: ${errText} (조회 실패 ${failures.length}건)`);
            else if (failures.length) console.log(`조회 실패 ${failures.length}건이 있었지만 정상 응답도 ${okCalls}건 받아 실패로 세지 않음`);

            const state = fs.existsSync(HEALTH_FILE) ? JSON.parse(fs.readFileSync(HEALTH_FILE, 'utf8')) : {};
            const { health, messages } = nextHealth(state._health, failed, errText, Date.now());
            for (const content of messages) {
              const res = await fetch(process.env.DISCORD_WEBHOOK, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content })
              });
              console.log('Discord 응답 상태:', res.status);
            }
            // 한 번도 실패한 적 없으면 파일에 _health를 만들지 않는다(불필요한 커밋 방지).
            if (state._health || failed) {
              state._health = health;
              fs.writeFileSync(HEALTH_FILE, JSON.stringify(state, null, 2));
            }
          }

          run();
          SCRIPT_EOF
          node check_megabox.js

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TARGETS=""
          for f in megabox_state.json megabox_movie_cache.json; do
            if [ -f "$f" ]; then
              git add "$f"
              TARGETS="$TARGETS $f"
            fi
          done
          if [ -n "$TARGETS" ] && [ -n "$(git status --porcelain -- $TARGETS)" ]; then
            git commit -m "chore: update Megabox booking state/cache"
            # 다른 워크플로우가 먼저 push했을 수 있으므로 rebase 후 push, 실패 시 재시도.
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
              sleep 3
            done
            exit 1
          else
            echo "상태 변경 없음"
          fi

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -H 'Content-Type: application/json' \
            -d "{\"content\":\"⚠️ 메가박스 예매 감시 실패 — 알림이 누락될 수 있음\n$RUN_URL\"}" \
            "$DISCORD_WEBHOOK" || true
