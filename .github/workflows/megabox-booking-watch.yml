name: 메가박스 예매 오픈 감시

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: megabox-booking-watch
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check whether movie-code resolution is needed
        id: precheck
        run: |
          if [ ! -f megabox_movie_cache.json ]; then echo '{}' > megabox_movie_cache.json; fi
          NEED=false
          if [ -f keywords.txt ]; then
            while IFS= read -r kw; do
              [ -z "$kw" ] && continue
              code=$(jq -r --arg k "$kw" '.[$k] // empty' megabox_movie_cache.json)
              if [ -z "$code" ]; then NEED=true; fi
            done < keywords.txt
          fi
          echo "need_resolution=$NEED" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.precheck.outputs.need_resolution == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright
        if: steps.precheck.outputs.need_resolution == 'true'
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Resolve missing movie codes
        if: steps.precheck.outputs.need_resolution == 'true'
        run: |
          cat > resolve_megabox.js << 'SCRIPT_EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const cache = fs.existsSync('megabox_movie_cache.json') ? JSON.parse(fs.readFileSync('megabox_movie_cache.json', 'utf8')) : {};
          const keywords = fs.readFileSync('keywords.txt', 'utf8').split('\n').map(s => s.trim()).filter(Boolean);
          const missing = keywords.filter(k => !cache[k]);

          (async () => {
            console.log('캐시 필요 키워드:', JSON.stringify(missing));
            if (missing.length === 0) { console.log('캐시 필요 없음 — 종료'); return; }
            const browser = await chromium.launch();

            for (const keyword of missing) {
              const page = await browser.newPage();
              let movieNo = null;
              const seenPosts = [];
              try {
                // 페이지 로드 직후엔 기본 선택된(엉뚱한) 영화의 요청이 먼저 나가므로,
                // 그게 다 끝난 뒤에야 감청을 시작해서 우리가 클릭한 영화만 잡는다.
                await page.goto('https://www.megabox.co.kr/booking/timetable', { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForTimeout(1500);
                console.log(`"${keyword}": 페이지 로드 완료, 클릭 시도`);
                page.on('request', req => {
                  const post = req.postData();
                  if (post) seenPosts.push(post.slice(0, 200));
                  if (!movieNo && post) {
                    const m = post.match(/"movieNo"\s*:\s*"?(\d+)"?/);
                    if (m) movieNo = m[1];
                  }
                });
                await page.locator(`text=${keyword}`).first().click({ timeout: 10000 });
                console.log(`"${keyword}": 클릭 성공, 네트워크 대기`);
                await page.waitForTimeout(1500);
              } catch (e) {
                console.log(`"${keyword}": 메가박스 영화 목록에서 못 찾음/클릭 실패 — ${e.message.split('\n')[0]}`);
              }
              await page.close();
              if (movieNo) {
                cache[keyword] = movieNo;
                console.log(`"${keyword}": movieNo=${movieNo} 확인, 캐시 저장`);
              } else {
                console.log(`"${keyword}": movieNo 캡처 실패. 관측된 POST 요청 ${seenPosts.length}건: ${JSON.stringify(seenPosts.slice(0,5))}`);
              }
            }

            await browser.close();
            fs.writeFileSync('megabox_movie_cache.json', JSON.stringify(cache, null, 2));
            console.log('캐시 파일 저장 완료:', JSON.stringify(cache));
          })();
          SCRIPT_EOF
          node resolve_megabox.js

      - name: Check booking status and notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat > check_megabox.js << 'SCRIPT_EOF'
          const fs = require('fs');

          function loadLines(file) {
            if (!fs.existsSync(file)) return [];
            return fs.readFileSync(file, 'utf8').split('\n').map(s => s.trim()).filter(Boolean);
          }

          function loadMegaboxTheaters() {
            const out = [];
            for (const line of loadLines('theaters.txt')) {
              const parts = line.split(',').map(s => s.trim());
              if (parts[0] === 'MEGABOX' && parts[1] && parts[2]) out.push({ name: parts[1], areaCd: parts[2] });
            }
            return out;
          }

          function nextDates(n) {
            const now = new Date(Date.now() + 9 * 60 * 60 * 1000); // KST
            const out = [];
            for (let i = 0; i <= n; i++) {
              const d = new Date(now);
              d.setDate(d.getDate() + i);
              out.push(d.toISOString().slice(0, 10).replace(/-/g, ''));
            }
            return out;
          }

          // megabox.co.kr이 GitHub Actions발 접속을 간헐적으로 커넥션 타임아웃시킴(반복 확인됨).
          // 재시도 없이 예외가 나면 전체 스크립트가 죽어서, 호출 하나당 재시도 + 최종 실패시 스킵 처리.
          async function fetchWithRetry(url, options, attempts = 3, delayMs = 2000) {
            let lastErr;
            for (let i = 0; i < attempts; i++) {
              try {
                return await fetch(url, options);
              } catch (e) {
                lastErr = e;
                if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs));
              }
            }
            throw lastErr;
          }

          async function getSchedule(movieNo, playDe, areaCd) {
            const fd = new URLSearchParams();
            fd.append('masterType', 'movie');
            fd.append('movieNo', movieNo);
            fd.append('movieNo1', movieNo);
            // firstAt=Y는 요청한 playDe를 무시하고 서버가 "실제 첫 상영일"로 덮어써서 응답함
            // (직접 확인함) — 우리가 지정한 날짜를 정확히 조회하려면 반드시 N이어야 함.
            fd.append('firstAt', 'N');
            fd.append('playDe', playDe);
            fd.append('areaCd', areaCd);
            try {
              const r = await fetchWithRetry('https://www.megabox.co.kr/on/oh/ohc/Brch/schedulePage.do', { method: 'POST', body: fd });
              const j = await r.json();
              return (j.megaMap && j.megaMap.movieFormList) || [];
            } catch (e) {
              console.log(`  (areaCd=${areaCd}, playDe=${playDe} 조회 실패, 이번엔 스킵: ${e.message})`);
              return [];
            }
          }

          (async () => {
            const keywords = loadLines('keywords.txt');
            const theaters = loadMegaboxTheaters();
            const cache = fs.existsSync('megabox_movie_cache.json') ? JSON.parse(fs.readFileSync('megabox_movie_cache.json', 'utf8')) : {};
            if (keywords.length === 0 || theaters.length === 0) {
              console.log('keywords.txt 또는 theaters.txt(MEGABOX)에 감시 대상이 없음. 종료.');
              return;
            }

            const state = fs.existsSync('megabox_state.json') ? JSON.parse(fs.readFileSync('megabox_state.json', 'utf8')) : {};
            let stateChanged = false;
            const dates = nextDates(7);

            for (const keyword of keywords) {
              const movieNo = cache[keyword];
              if (!movieNo) {
                console.log(`"${keyword}": movieNo 아직 미확인 — 스킵 (다음 실행에 재시도)`);
                continue;
              }

              // 이미 알림 나간 극장은 조회에서 제외 (전부 완료면 API 호출 자체를 생략)
              const pending = theaters.filter(t => state[`${keyword}|${t.name}`] !== true);
              if (pending.length === 0) continue;

              const found = {};
              for (const areaCd of new Set(pending.map(t => t.areaCd))) {
                const targets = pending.filter(t => t.areaCd === areaCd);
                for (const playDe of dates) {
                  const list = await getSchedule(movieNo, playDe, areaCd);
                  if (list.length === 0) continue;
                  for (const theater of targets) {
                    if (list.some(item => (item.brchNm || '').includes(theater.name))) {
                      (found[theater.name] = found[theater.name] || []).push(playDe);
                    }
                  }
                }
              }

              for (const theater of theaters) {
                const stateKey = `${keyword}|${theater.name}`;
                if (state[stateKey] === true) continue;

                if (found[theater.name]) {
                  const displayDate = found[theater.name].map(d => d.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3')).join(', ');
                  console.log(`"${keyword}" @ 메가박스 ${theater.name}: 예매 오픈 확인 (${displayDate})`);
                  const content = `🎬 예매 오픈!\n영화: ${keyword}\n극장: 메가박스 ${theater.name}\n상영일: ${displayDate}`;
                  const res = await fetch(process.env.DISCORD_WEBHOOK, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content })
                  });
                  console.log('Discord 응답 상태:', res.status);
                  state[stateKey] = true;
                  stateChanged = true;
                } else {
                  console.log(`"${keyword}" @ 메가박스 ${theater.name}: 아직 미오픈`);
                }
              }
            }

            if (stateChanged) fs.writeFileSync('megabox_state.json', JSON.stringify(state, null, 2));
          })();
          SCRIPT_EOF
          node check_megabox.js

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TARGETS=""
          for f in megabox_state.json megabox_movie_cache.json; do
            if [ -f "$f" ]; then
              git add "$f"
              TARGETS="$TARGETS $f"
            fi
          done
          if [ -n "$TARGETS" ] && [ -n "$(git status --porcelain -- $TARGETS)" ]; then
            git commit -m "chore: update Megabox booking state/cache"
            # 다른 워크플로우가 먼저 push했을 수 있으므로 rebase 후 push, 실패 시 재시도.
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
              sleep 3
            done
            exit 1
          else
            echo "상태 변경 없음"
          fi

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -H 'Content-Type: application/json' \
            -d "{\"content\":\"⚠️ 메가박스 예매 감시 실패 — 알림이 누락될 수 있음\n$RUN_URL\"}" \
            "$DISCORD_WEBHOOK" || true
