name: 롯데시네마 예매 오픈 감시

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lotte-booking-watch
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check whether movie-code resolution is needed
        id: precheck
        run: |
          if [ ! -f lotte_movie_cache.json ]; then echo '{}' > lotte_movie_cache.json; fi
          NEED=false
          if [ -f keywords.txt ]; then
            while IFS= read -r kw; do
              [ -z "$kw" ] && continue
              code=$(jq -r --arg k "$kw" '.[$k] // empty' lotte_movie_cache.json)
              if [ -z "$code" ]; then NEED=true; fi
            done < keywords.txt
          fi
          echo "need_resolution=$NEED" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.precheck.outputs.need_resolution == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright
        if: steps.precheck.outputs.need_resolution == 'true'
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Resolve missing movie codes
        if: steps.precheck.outputs.need_resolution == 'true'
        run: |
          cat > resolve_lotte.js << 'SCRIPT_EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const cache = fs.existsSync('lotte_movie_cache.json') ? JSON.parse(fs.readFileSync('lotte_movie_cache.json', 'utf8')) : {};
          const keywords = fs.readFileSync('keywords.txt', 'utf8').split('\n').map(s => s.trim()).filter(Boolean);
          const missing = keywords.filter(k => !cache[k]);

          (async () => {
            console.log('캐시 필요 키워드:', JSON.stringify(missing));
            if (missing.length === 0) { console.log('캐시 필요 없음 — 종료'); return; }
            const browser = await chromium.launch();

            for (const keyword of missing) {
              const page = await browser.newPage();
              let movieCd = null;
              const seenPosts = [];
              try {
                // 페이지 로드 직후엔 기본 선택된(엉뚱한) 영화의 요청이 먼저 나갈 수 있으므로,
                // 그게 다 끝난 뒤에야 감청을 시작해서 우리가 클릭한 영화만 잡는다.
                await page.goto('https://www.lottecinema.co.kr/NLCHS/Ticketing', { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForTimeout(1500);
                console.log(`"${keyword}": 페이지 로드 완료, 클릭 시도`);
                page.on('request', req => {
                  const post = req.postData();
                  if (post) seenPosts.push(post.slice(0, 200));
                  if (!movieCd && post) {
                    const m = post.match(/"(?:representationMovieCode|movieCd)":"(\d+)"/);
                    if (m) movieCd = m[1];
                  }
                });
                await page.locator(`text=${keyword}`).first().click({ timeout: 10000 });
                console.log(`"${keyword}": 클릭 성공, 네트워크 대기`);
                await page.waitForTimeout(1500);
              } catch (e) {
                console.log(`"${keyword}": 롯데시네마 영화 목록에서 못 찾음/클릭 실패 — ${e.message.split('\n')[0]}`);
              }
              await page.close();
              if (movieCd) {
                cache[keyword] = movieCd;
                console.log(`"${keyword}": movieCd=${movieCd} 확인, 캐시 저장`);
              } else {
                console.log(`"${keyword}": movieCd 캡처 실패. 관측된 POST 요청 ${seenPosts.length}건: ${JSON.stringify(seenPosts.slice(0,5))}`);
              }
            }

            await browser.close();
            fs.writeFileSync('lotte_movie_cache.json', JSON.stringify(cache, null, 2));
            console.log('캐시 파일 저장 완료:', JSON.stringify(cache));
          })();
          SCRIPT_EOF
          node resolve_lotte.js

      - name: Check booking status and notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat > check_lotte.js << 'SCRIPT_EOF'
          const fs = require('fs');

          function loadLines(file) {
            if (!fs.existsSync(file)) return [];
            return fs.readFileSync(file, 'utf8').split('\n').map(s => s.trim()).filter(Boolean);
          }

          function loadLotteTheaters() {
            const out = [];
            for (const line of loadLines('theaters.txt')) {
              const parts = line.split(',').map(s => s.trim());
              if (parts[0] === 'LOTTE' && parts[1] && parts[2]) out.push({ name: parts[1], cinemaID: parts[2] });
            }
            return out;
          }

          const GROWTH = 4;       // 같은 날짜의 일반 회차가 이만큼 이상 늘면 "회차 추가 오픈"으로 알림
          const FOLLOW_DAYS = 7;  // 첫 알림 후 이 기간 동안만 새 날짜/추가 회차를 추적
          // 시사회·GV·무대인사 같은 특별 상영은 "일반 예매 오픈"으로 치지 않는다.
          const SPECIAL_RE = /무대인사|GV|시사|관객과의|스페셜|커튼콜|라이브|특별|상영회|팬미팅|팬 미팅/i;
          const isSpecial = it => SPECIAL_RE.test([it.MovieNameKR, it.ScreenDivisionNameKR, it.AccompanyTypeNameKR, it.SequenceNoGroupNameKR, it.BkShowLabelTxtNm1, it.BkShowLabelTxtNm2].filter(Boolean).join(' '));

          const kstToday = () => new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
          const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);

          // state[key]: 없음(미알림) | true(예전 방식으로 알림 완료) | { since, dates: { 'YYYY-MM-DD': 일반 회차 수 } }
          // 첫 알림 이후(추적 단계)에는 15분에 한 번만 조회하고, FOLLOW_DAYS가 지나면 추적을 끝낸다.
          function shouldCheck(entry, today, followUpRun) {
            if (!entry) return true;
            if (entry !== true && daysBetween(entry.since, today) > FOLLOW_DAYS) return false;
            return followUpRun;
          }

          function evaluate(entry, cur, today) {
            const silent = entry === true; // 예전 방식 상태는 알림 없이 현재 상태를 기준선으로만 채택
            const next = entry && entry !== true ? { since: entry.since, dates: { ...entry.dates } } : { since: today, dates: {} };
            const events = [];
            // cur에는 "조회에 성공한 날짜"만 들어 있다(실패한 날짜는 없음). 0회는 그 날짜가 닫혀 있다는 뜻.
            for (const [d, c] of Object.entries(cur)) {
              const p = next.dates[d];
              if (c <= 0) { delete next.dates[d]; continue; } // 닫힌 날짜는 기준선에서 제거 → 다시 열리면 새로 알림
              if (p === undefined) {
                if (!silent) events.push({ date: d, count: c, kind: 'new' });
                next.dates[d] = c;
              } else if (!silent && c >= p + GROWTH) {
                events.push({ date: d, count: c, kind: 'more', added: c - p });
                next.dates[d] = c;
              } else if (c < p / 2) {
                next.dates[d] = c; // 회차가 절반 아래로 급감하면 기준선을 낮춰, 부풀려진 기준선이 이후 알림을 막지 않게 함
              }
            }
            for (const d of Object.keys(next.dates)) if (d < today) delete next.dates[d];
            return { events, next };
          }

          function buildMessage(movie, label, theater, events) {
            const news = events.filter(e => e.kind === 'new');
            const more = events.filter(e => e.kind === 'more');
            const title = news.length ? '🎬 예매 오픈!' : '🎟 회차 추가 오픈!';
            const dates = news.length
              ? news.map(e => `${e.date} (${e.count}회)`).join(', ')
              : more.map(e => `${e.date} (+${e.added}회)`).join(', ');
            let msg = `${title}\n영화: ${movie}\n극장: ${label} ${theater}\n상영일: ${dates}`;
            if (news.length && more.length) msg += `\n추가 오픈: ${more.map(e => `${e.date} (+${e.added}회)`).join(', ')}`;
            return msg;
          }

          function nextDates(n) {
            const now = new Date(Date.now() + 9 * 60 * 60 * 1000); // KST
            const out = [];
            for (let i = 0; i <= n; i++) {
              const d = new Date(now);
              d.setDate(d.getDate() + i);
              out.push(d.toISOString().slice(0, 10));
            }
            return out;
          }

          // 메가박스 쪽에서 GitHub Actions발 접속이 간헐적 커넥션 타임아웃 나는 걸 확인해서,
          // 같은 위험을 방지하기 위해 롯데 쪽 호출도 재시도 + 최종 실패시 스킵 처리.
          async function fetchWithRetry(url, options, attempts = 3, delayMs = 2000) {
            let lastErr;
            for (let i = 0; i < attempts; i++) {
              try {
                return await fetch(url, options);
              } catch (e) {
                lastErr = e;
                if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs));
              }
            }
            throw lastErr;
          }

          // 롯데 예매 캘린더(약 6주치)에서 상영이 잡힌 날짜(IsPlayDate=Y)만 골라 조회 대상으로 삼는다.
          // 선예매로 먼저 열리는 먼 날짜까지 잡을 수 있고, 상영 없는 날짜는 호출을 아낀다.
          // 캘린더 조회가 실패하면 기존처럼 오늘~+7일로 대체.
          async function getBookableDates() {
            try {
              const fd = new URLSearchParams();
              fd.append('paramList', JSON.stringify({ MethodName: 'GetTicketingPageTOBE', channelType: 'HO', osType: 'W', osVersion: 'bot', memberOnNo: '0' }));
              const r = await fetchWithRetry('https://www.lottecinema.co.kr/LCWS/Ticketing/TicketingData.aspx', { method: 'POST', body: fd });
              const j = await r.json();
              const items = (j.MoviePlayDates && j.MoviePlayDates.Items && j.MoviePlayDates.Items.Items) || [];
              const ds = items.filter(x => x.IsPlayDate === 'Y').map(x => x.PlayDate);
              if (ds.length > 0) return ds;
            } catch (e) {
              console.log(`  (예매 캘린더 조회 실패, 오늘~+7일로 대체: ${e.message})`);
            }
            return nextDates(7);
          }

          async function getPlaySequence(cinemaID, movieCd, playDate) {
            const fd = new URLSearchParams();
            fd.append('paramList', JSON.stringify({
              MethodName: 'GetPlaySequence', channelType: 'HO', osType: 'W', osVersion: 'bot',
              playDate, cinemaID, representationMovieCode: movieCd
            }));
            try {
              const r = await fetchWithRetry('https://www.lottecinema.co.kr/LCWS/Ticketing/TicketingData.aspx', { method: 'POST', body: fd });
              const j = await r.json();
              return (j.PlaySeqsHeader && j.PlaySeqsHeader.Items) || [];
            } catch (e) {
              console.log(`  (${playDate} 조회 실패, 이번엔 스킵: ${e.message})`);
              return null; // 실패는 "0회(닫힘)"와 구분해서 그 날짜를 이번 판정에서 제외한다
            }
          }

          (async () => {
            const keywords = loadLines('keywords.txt');
            const theaters = loadLotteTheaters();
            const cache = fs.existsSync('lotte_movie_cache.json') ? JSON.parse(fs.readFileSync('lotte_movie_cache.json', 'utf8')) : {};
            if (keywords.length === 0 || theaters.length === 0) {
              console.log('keywords.txt 또는 theaters.txt(LOTTE)에 감시 대상이 없음. 종료.');
              return;
            }

            const state = fs.existsSync('lotte_state.json') ? JSON.parse(fs.readFileSync('lotte_state.json', 'utf8')) : {};
            let stateChanged = false;
            let dates = null; // 조회할 게 있을 때만 캘린더를 한 번 가져온다
            const today = kstToday();
            const followUpRun = new Date().getUTCMinutes() % 15 < 3;

            for (const keyword of keywords) {
              const movieCd = cache[keyword];
              if (!movieCd) {
                console.log(`"${keyword}": movieCd 아직 미확인 — 스킵 (다음 실행에 재시도)`);
                continue;
              }
              const targets = theaters.filter(t => shouldCheck(state[`${keyword}|${t.name}`], today, followUpRun));
              if (targets.length === 0) continue;
              if (!dates) dates = await getBookableDates();

              for (const theater of targets) {
                const stateKey = `${keyword}|${theater.name}`;
                const entry = state[stateKey];

                const cur = {};
                for (const playDate of dates) {
                  const items = await getPlaySequence(theater.cinemaID, movieCd, playDate);
                  if (items === null) continue;
                  // 요청한 영화의 회차만 센다(메가박스에서 다른 영화 회차가 섞여 내려온 사례가 있어 롯데에도 동일 방어).
                  cur[playDate] = items.filter(it => String(it.RepresentationMovieCode) === String(movieCd) && !isSpecial(it)).length;
                }

                const { events, next } = evaluate(entry, cur, today);
                if (events.length > 0) {
                  console.log(`"${keyword}" @ 롯데시네마 ${theater.name}: ${events.map(e => `${e.kind} ${e.date}`).join(', ')}`);
                  const res = await fetch(process.env.DISCORD_WEBHOOK, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: buildMessage(keyword, '롯데시네마', theater.name, events) })
                  });
                  console.log('Discord 응답 상태:', res.status);
                } else {
                  console.log(`"${keyword}" @ 롯데시네마 ${theater.name}: 새 일반 회차 없음`);
                }
                // 알림이 났거나, 예전 상태 이관이거나, 추적 중 기준선이 바뀐 경우에만 저장
                if (events.length > 0 || entry === true || (entry && JSON.stringify(next) !== JSON.stringify(entry))) {
                  state[stateKey] = next;
                  stateChanged = true;
                }
              }
            }

            if (stateChanged) fs.writeFileSync('lotte_state.json', JSON.stringify(state, null, 2));
          })();
          SCRIPT_EOF
          node check_lotte.js

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TARGETS=""
          for f in lotte_state.json lotte_movie_cache.json; do
            if [ -f "$f" ]; then
              git add "$f"
              TARGETS="$TARGETS $f"
            fi
          done
          if [ -n "$TARGETS" ] && [ -n "$(git status --porcelain -- $TARGETS)" ]; then
            git commit -m "chore: update Lotte Cinema booking state/cache"
            # 다른 워크플로우가 먼저 push했을 수 있으므로 rebase 후 push, 실패 시 재시도.
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
              sleep 3
            done
            exit 1
          else
            echo "상태 변경 없음"
          fi

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -H 'Content-Type: application/json' \
            -d "{\"content\":\"⚠️ 롯데시네마 예매 감시 실패 — 알림이 누락될 수 있음\n$RUN_URL\"}" \
            "$DISCORD_WEBHOOK" || true
